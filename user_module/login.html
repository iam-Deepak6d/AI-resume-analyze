<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — TalentLens</title>
  <base href="/user/">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      background: var(--bg);
    }

    .auth-box {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 2rem;
      box-shadow: var(--shadow-md);
    }

    .auth-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text);
    }

    .auth-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }

    .auth-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .demo-box {
      background: var(--bg-card-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 1rem;
      margin-bottom: 1.5rem;
    }

    .demo-box-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
    }

    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.25rem;
    }

    .auth-tab-btn {
      flex: 1;
      text-align: center;
      padding: 0.65rem 0;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
    }

    .auth-tab-btn.active {
      color: var(--primary-text);
      border-bottom-color: var(--primary);
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.65rem 0.85rem;
      transition: border-color var(--transition);
    }

    .form-input:focus {
      outline: none;
      border-color: var(--border-focus);
    }

    .auth-error {
      background: var(--danger-soft);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--danger-text);
      font-size: 0.85rem;
      padding: 0.65rem 0.85rem;
      border-radius: var(--radius-sm);
      margin-bottom: 1rem;
      display: none;
    }

    .auth-footer {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-subtle);
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .auth-footer a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
    }

    .auth-footer a:hover {
      color: var(--text);
    }
  </style>
</head>
<body>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <div class="auth-box">
    
    <div class="auth-brand">
      <div class="brand-icon">⚡</div>
      <span>TalentLens</span>
    </div>

    <h1 class="auth-title">Candidate Sign In</h1>
    <p class="auth-desc">Check your ATS score and get matched with tech roles.</p>

    <!-- Quick Demo Box -->
    <div class="demo-box">
      <div class="demo-box-label">
        <span>Quick Demo Access</span>
        <span style="color: var(--primary-text);">Student Profile</span>
      </div>
      <button type="button" class="btn btn-secondary btn-block btn-sm" onclick="quickLoginStudent()">
        Continue as Demo Student (student@demo.com)
      </button>
    </div>

    <!-- Tabs: Sign In / Register -->
    <div class="auth-tabs">
      <button type="button" class="auth-tab-btn active" id="tab-btn-signin" onclick="switchTab('signin')">Sign In</button>
      <button type="button" class="auth-tab-btn" id="tab-btn-register" onclick="switchTab('register')">Create Account</button>
    </div>

    <div id="auth-error-msg" class="auth-error"></div>

    <!-- Sign In Form -->
    <form id="student-signin-form">
      <div class="form-group">
        <label class="form-label" for="login-email">Email Address</label>
        <input type="email" id="login-email" class="form-input" placeholder="student@demo.com" required value="student@demo.com">
      </div>
      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <input type="password" id="login-password" class="form-input" placeholder="Password" required value="student123">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="signin-btn">
        Sign In
      </button>
    </form>

    <!-- Register Form -->
    <form id="student-register-form" style="display: none;">
      <div class="form-group">
        <label class="form-label" for="reg-name">Full Name</label>
        <input type="text" id="reg-name" class="form-input" placeholder="Priya Sharma" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="reg-email">Email Address</label>
        <input type="email" id="reg-email" class="form-input" placeholder="priya@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="reg-password">Password (min. 6 characters)</label>
        <input type="password" id="reg-password" class="form-input" placeholder="Create password" required minlength="6">
      </div>
      <div class="form-group">
        <label class="form-label" for="reg-target-role">Target Role</label>
        <select id="reg-target-role" class="custom-select">
          <option value="Frontend Developer">Frontend Developer</option>
          <option value="Backend Engineer">Backend Engineer</option>
          <option value="Full Stack Developer" selected>Full Stack Developer</option>
          <option value="Data Scientist / AI Engineer">Data Scientist / AI Engineer</option>
          <option value="DevOps & Cloud Engineer">DevOps & Cloud Engineer</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="register-btn">
        Create Account
      </button>
    </form>

    <div class="auth-footer">
      Recruiter or Admin? <a href="/admin/login">Admin Console →</a>
    </div>

  </div>

  <script src="js/api.js"></script>
  <script>
    function switchTab(tab) {
      const signinBtn = document.getElementById('tab-btn-signin');
      const regBtn = document.getElementById('tab-btn-register');
      const signinForm = document.getElementById('student-signin-form');
      const regForm = document.getElementById('student-register-form');
      const errorBox = document.getElementById('auth-error-msg');

      errorBox.style.display = 'none';

      if (tab === 'signin') {
        signinBtn.classList.add('active');
        regBtn.classList.remove('active');
        signinForm.style.display = 'block';
        regForm.style.display = 'none';
      } else {
        signinBtn.classList.remove('active');
        regBtn.classList.add('active');
        signinForm.style.display = 'none';
        regForm.style.display = 'block';
      }
    }

    async function quickLoginStudent() {
      try {
        await API.login('student@demo.com', 'student123');
        window.location.href = '/user/';
      } catch (err) {
        showError(err.message);
      }
    }

    function showError(msg) {
      const errorBox = document.getElementById('auth-error-msg');
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }

    // Sign in form handler
    document.getElementById('student-signin-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value.trim();
      const btn = document.getElementById('signin-btn');

      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        await API.login(email, password);
        window.location.href = '/user/';
      } catch (err) {
        showError(err.message || 'Login failed. Please check your credentials.');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });

    // Register form handler
    document.getElementById('student-register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value.trim();
      const role = document.getElementById('reg-target-role').value;
      const btn = document.getElementById('register-btn');

      btn.disabled = true;
      btn.textContent = 'Creating account...';

      try {
        await API.register(name, email, password, role);
        window.location.href = '/user/';
      } catch (err) {
        showError(err.message || 'Registration failed.');
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
